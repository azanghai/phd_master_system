name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            arch: x64
            build-script: desktop:build:win
          - platform: macos
            os: macos-latest
            arch: aarch64
            build-script: desktop:build:mac
          - platform: linux
            os: ubuntu-22.04
            arch: x64
            build-script: desktop:build:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop bundles
        run: npm run ${{ matrix.build-script }}

      - name: Read package version
        id: package
        shell: bash
        run: node -e "const pkg=require('./package.json'); console.log('version=' + pkg.version)" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          version="${{ steps.package.outputs.version }}"
          platform="${{ matrix.platform }}"
          arch="${{ matrix.arch }}"

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            kind=""
            extension="${filename##*.}"

            case "$filename" in
              *.exe) kind="setup"; extension="exe" ;;
              *.msi) kind="msi"; extension="msi" ;;
              *.dmg) kind="dmg"; extension="dmg" ;;
              *.deb) kind="deb"; extension="deb" ;;
              *.rpm) kind="rpm"; extension="rpm" ;;
              *.AppImage) kind="appimage"; extension="AppImage" ;;
              *) continue ;;
            esac

            cp "$file" "release-assets/PhD-Workbench-${version}-${platform}-${arch}-${kind}.${extension}"
          done < <(find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -print0)

          ls -la release-assets

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhD-Workbench-${{ steps.package.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publish desktop bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "PhD Workbench $GITHUB_REF_NAME" --notes "Automated desktop and Android build artifacts." || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release edit "$GITHUB_REF_NAME" --title "PhD Workbench $GITHUB_REF_NAME" --notes "Automated desktop and Android build artifacts."

          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
