name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            build-script: desktop:build:win
            artifact-glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos
            os: macos-latest
            build-script: desktop:build:mac
            artifact-glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - platform: linux
            os: ubuntu-22.04
            build-script: desktop:build:linux
            artifact-glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop bundles
        run: npm run ${{ matrix.build-script }}

      - name: Read package version
        id: package
        shell: bash
        run: node -e "const pkg=require('./package.json'); console.log('version=' + pkg.version)" >> "$GITHUB_OUTPUT"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 博士工作台-${{ steps.package.outputs.version }}-${{ matrix.platform }}-x64
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
